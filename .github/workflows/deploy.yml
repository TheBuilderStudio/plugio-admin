name: Deploy Admin — Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: plugio-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/admin-ci.yml

  deploy:
    name: Deploy to Production VPS
    runs-on: [self-hosted, plugio-vps]
    needs: ci
    timeout-minutes: 45
    if: github.repository == 'TheBuilderStudio/plugio-admin'

    steps:
      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory "$HOME/plugio/prod/plugio-admin" || true

      - name: Sync and deploy admin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ADMIN_DIR="$HOME/plugio/prod/plugio-admin"
          if [[ ! -d "$ADMIN_DIR" ]]; then
            mkdir -p "$HOME/plugio/prod"
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ADMIN_DIR"
          fi
          cd "$ADMIN_DIR"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          git reset --hard origin/main
          git checkout main
          docker build -t plugio-admin:latest -f deployment/Dockerfile .
          docker restart plugio-admin
