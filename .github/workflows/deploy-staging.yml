name: Deploy Admin — Staging

on:
  push:
    branches:
      - dev
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-admin-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/admin-ci.yml

  deploy:
    name: Deploy to Staging VPS
    runs-on: [self-hosted, plugio-vps]
    needs: ci
    timeout-minutes: 45
    if: github.repository == 'TheBuilderStudio/plugio-admin'

    steps:
      - name: Configure git safe directories
        run: |
          git config --global --add safe.directory "$HOME/plugio/stage/plugio-admin" || true

      - name: Sync and deploy staging admin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ADMIN_DIR="$HOME/plugio/stage/plugio-admin"
          if [[ ! -d "$ADMIN_DIR" ]]; then
            mkdir -p "$HOME/plugio/stage"
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$ADMIN_DIR"
          fi
          cd "$ADMIN_DIR"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          git checkout "${GITHUB_REF_NAME}"
          docker build -t plugio-admin:latest -f deployment/Dockerfile .
          docker restart plugio-admin-staging
